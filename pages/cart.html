<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="../style.css" rel="stylesheet">
</head>
<body>
   <nav id="main-nav">
    <div class="logo-container">
        <a class="logo-image" href="../index.html"><img src="../assets/lbh_logo.png" alt="LBH Logo"></a>
    </div>
    <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="rack.html">The Rack</a></li>
        <li><a href="../pages/contact.html">Contact</a></li>
        <li><a href="cart.html"><img class="nav-cart-button" src="../assets/cart.png" alt="Shopping cart icon, checkout page"></a></li>
    </ul>
    </nav>

    <div id="cart-page-main">
        <div id="cart-page-item-container">
            <div class="cart-item cart-page-div">
                <div class="cart-item-desc">
                    <img class="cart-page-item-image" src="https://gameinformer.com/sites/default/files/styles/max_325x325/public/2025/03/24/c7934679/362.jpg.webp" alt="Game Informer magazine issue 362 featuring Final Fantasy VII Rebirth">
                    <p class="cart-item-name">Game Informer: Issue 362 <i class="cart-item-quantity">(-  1  +)</i></p>
                </div>
                <p class="cart-item-price">$13.99</p>
            </div>
            <div class="cart-item cart-page-div">
                <div class="cart-item-desc">
                    <img class="cart-page-item-image" src="https://gameinformer.com/sites/default/files/styles/max_325x325/public/2025-03/366.jpg.webp" alt="Game Informer magazine issue 366 featuring Hades II">
                    <p class="cart-item-name">Game Informer: Issue 366 <i class="cart-item-quantity">(-  1  +)</i></p>
                </div>
                <p class="cart-item-price">$13.99</p>
            </div>
        </div>
        <div id="cart-page-total" class="cart-page-div">
            <p id="order-sum-text">Order Summary</p>
            <p id="cart-subtotal">Subtotal: CAD $27.98</p>
            <p id="cart-shipping">Shipping fee: CAD $10.00</p>
            <p id="cart-total"><strong>Order Total: CAD $37.98</strong></p>
            <a id="checkout-button" href="checkout.html">
                Checkout
            </a>
        </div>
    </div>
</body>
</html>
