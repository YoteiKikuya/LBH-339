<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
   <nav id="main-nav">
    <div class="logo-container">
        <a class="logo-image" href="../index.html"><img src="../assets/lbh_logo.png" alt="LBH Logo"></a>
    </div>
    <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="rack.html">The Rack</a></li>

    </ul>
    </nav>
    <form id="contact-form">
        <fieldset id="contact-fields">
            <h1 id="contact-header">Contact Form</h1>
            <div class="text-input-split">
                <input type="text" class="text-input contact-text-input" id="contact-name" placeholder="Name">
                <input type="text" class="text-input contact-text-input" id="contact-email" placeholder="Email">
            </div>
            <input type="text" class="text-input contact-text-input" id="subject" placeholder="Subject">
            <textarea class="text-input contact-text-input" id="message" placeholder="Message" rows="6" cols="50" ></textarea>
            <button id="contact-submit" class="button-nav" type="submit">Submit</button>
        </fieldset>
    </form>
    <footer>
        <p class="footer-heading">Quick Links</p>
        <a href="../pages/styleGuide.html">Style Guide</a>
        <a href="../pages/citations.html">Citations</a>
